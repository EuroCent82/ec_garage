<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <script src="js/nui-env.js"></script>
  <style>html.nui-embed,html.nui-embed body{background:transparent!important}html.nui-embed body::before{display:none!important}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EC Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/ec-chat-theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nui.css" />
</head>
<body>
  <div id="app" class="garage hidden" data-mode="land">
    <div class="garage-backdrop"></div>

    <div class="garage-panel">
      <header class="garage-header">
        <div class="header-brand">
          <div class="brand-icon" id="brand-icon"></div>
          <div>
            <h1 class="brand-title" id="brand-title">Legion Square Garage</h1>
            <p class="brand-subtitle" id="brand-subtitle">Landfahrzeuge</p>
          </div>
        </div>

        <div class="header-stats" id="header-stats"></div>

        <button type="button" class="btn-close" id="btn-close" aria-label="Schließen"></button>
      </header>

      <div class="garage-toolbar" id="toolbar-garage">
        <nav class="tab-nav" role="tablist">
          <button type="button" class="tab active" data-tab="parked" role="tab"></button>
          <button type="button" class="tab" data-tab="out" role="tab"></button>
        </nav>

        <div class="toolbar-actions">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Fahrzeug suchen…" autocomplete="off" />
          </div>
          <button type="button" class="filter-btn active" data-filter="all">Alle</button>
          <button type="button" class="filter-btn" data-filter="favorites">Favoriten</button>
        </div>
      </div>

      <div class="garage-toolbar hidden" id="toolbar-impound">
        <div class="impound-info-banner">
          <span>Freikauf nur am <strong>jeweiligen Abschlepphof</strong> — hier nur die Übersicht.</span>
        </div>

        <div class="toolbar-actions">
          <div class="search-box">
            <input type="text" id="search-input-impound" placeholder="Fahrzeug oder Abschlepphof…" autocomplete="off" />
          </div>
          <select class="lot-filter" id="lot-filter">
            <option value="all">Alle Standorte</option>
          </select>
          <button type="button" class="btn-close" id="btn-close-impound" aria-label="Schließen"></button>
        </div>
      </div>

      <main class="garage-content">
        <div class="vehicle-grid" id="vehicle-grid"></div>
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon" id="empty-icon"></div>
          <h3 id="empty-title">Keine Fahrzeuge</h3>
          <p id="empty-text">In dieser Kategorie sind keine Fahrzeuge vorhanden.</p>
        </div>
      </main>

      <footer class="garage-footer">
        <span class="footer-hint" id="footer-hint">
          <kbd>E</kbd> Einparken &nbsp;·&nbsp; <kbd>ESC</kbd> Schließen
        </span>
        <span class="footer-brand">EC Garage</span>
      </footer>

      <div class="modal hidden" id="rename-modal" aria-hidden="true">
        <div class="modal-backdrop" data-dismiss="modal" tabindex="-1"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true">
          <div class="modal-header">
            <h2>Fahrzeug bearbeiten</h2>
            <button type="button" class="btn-close modal-close" aria-label="Schließen"></button>
          </div>
          <div class="modal-body">
            <p class="modal-model" id="rename-model"></p>
            <label class="input-label" for="rename-input">Anzeigename</label>
            <input type="text" id="rename-input" class="input-field" maxlength="32" placeholder="z.B. Mein Daily" autocomplete="off" />
            <label class="input-label" for="note-input">Notiz <span class="optional">(optional)</span></label>
            <textarea id="note-input" class="input-field textarea" maxlength="120" placeholder="Kurze Notiz zum Fahrzeug…" rows="3"></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-ghost modal-close">Abbrechen</button>
            <button type="button" class="btn btn-primary" id="rename-save">Speichern</button>
          </div>
        </div>
      </div>

      <div class="toast hidden" id="toast"><span id="toast-message"></span></div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
