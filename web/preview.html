<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EC Garage – Browser Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Roboto Condensed', system-ui, sans-serif;
      background: #12151a;
      overflow-x: hidden;
    }
    .preview-stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 96px;
      gap: 0;
    }
    #garage-frame {
      width: min(1180px, 94vw);
      height: min(780px, calc(100vh - 140px));
      border: 0;
      border-radius: 20px;
      background: transparent;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }
    .preview-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(14, 17, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 999px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .preview-bar span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b7280;
      padding: 0 8px;
      align-self: center;
    }
    .preview-bar button,
    .preview-bar a {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(27, 27, 34, 0.9);
      color: #9ca3af;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s ease;
    }
    .preview-bar button:hover,
    .preview-bar a:hover { color: #f3f4f6; border-color: rgba(255, 255, 255, 0.2); }
    .preview-bar button.active {
      background: linear-gradient(180deg, #4c7241 0%, #314a2d 100%);
      border-color: rgba(107, 155, 95, 0.45);
      color: #fff;
      box-shadow: 0 4px 16px rgba(67, 160, 71, 0.25);
    }
    .preview-bar button.impound.active {
      background: linear-gradient(180deg, #9a7344 0%, #5c4528 100%);
      border-color: rgba(216, 161, 92, 0.45);
      color: #fff;
      box-shadow: 0 4px 16px rgba(216, 161, 92, 0.25);
    }
    .preview-bar button.creator-toggle.active {
      background: linear-gradient(180deg, #9a7344 0%, #5c4528 100%);
      border-color: rgba(216, 161, 92, 0.45);
      color: #fff;
    }
    #creator-frame {
      width: min(1280px, 96vw);
      height: min(820px, calc(100vh - 140px));
      border: 0;
      border-radius: 20px;
      background: transparent;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }
    #creator-frame.hidden { display: none; }
  </style>
</head>
<body>
  <div class="preview-stage">
    <iframe id="garage-frame" src="index.html" title="EC Garage"></iframe>
    <iframe id="creator-frame" class="hidden" src="creator.html" title="EC Garage Creator"></iframe>
  </div>
  <div class="preview-bar">
    <span>Preview</span>
    <button type="button" class="active" data-screen="garage" data-mode="land">Land</button>
    <button type="button" data-screen="garage" data-mode="air">Luft</button>
    <button type="button" data-screen="garage" data-mode="water">Wasser</button>
    <button type="button" class="impound" data-screen="garage" data-mode="impound">Impound</button>
    <button type="button" class="creator-toggle" data-screen="creator">Creator</button>
  </div>
  <script>
    const garageFrame = document.getElementById('garage-frame');
    const creatorFrame = document.getElementById('creator-frame');
    const creatorBtn = document.querySelector('.creator-toggle');

    function openGarageMode(mode) {
      garageFrame.classList.remove('hidden');
      creatorFrame.classList.add('hidden');
      creatorBtn?.classList.remove('active');
      document.querySelectorAll('[data-screen="garage"]').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      garageFrame.contentWindow?.postMessage({ action: 'open', mode }, '*');
    }

    function openCreator() {
      garageFrame.classList.add('hidden');
      creatorFrame.classList.remove('hidden');
      document.querySelectorAll('[data-screen="garage"]').forEach((b) => b.classList.remove('active'));
      creatorBtn?.classList.add('active');
      creatorFrame.contentWindow?.postMessage({ action: 'openCreator' }, '*');
    }

    garageFrame.addEventListener('load', () => openGarageMode('land'));

    document.querySelectorAll('[data-screen="garage"]').forEach((btn) => {
      btn.addEventListener('click', () => openGarageMode(btn.dataset.mode));
    });
    creatorBtn?.addEventListener('click', openCreator);
  </script>
</body>
</html>
