<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EC Garage – Browser Preview</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d24; }
    #garage-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .preview-menu { z-index: 10000; }
  </style>
</head>
<body>
  <iframe id="garage-frame" src="index.html"></iframe>
  <div class="preview-menu" id="preview-menu">
    <span class="preview-label">UI Preview</span>
    <button type="button" class="preview-btn active" data-mode="land">Landfahrzeuge</button>
    <button type="button" class="preview-btn" data-mode="air">Luftfahrzeuge</button>
    <button type="button" class="preview-btn" data-mode="water">Wasserfahrzeuge</button>
    <button type="button" class="preview-btn preview-btn--impound" data-mode="impound">Abschlepphof</button>
    <a class="preview-btn preview-btn--creator" href="creator.html">Creator</a>
  </div>
  <script>
    const frame = document.getElementById('garage-frame');
    document.querySelectorAll('.preview-btn[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        frame.contentWindow.postMessage({ action: 'open', mode: btn.dataset.mode }, '*');
      });
    });
  </script>
</body>
</html>
